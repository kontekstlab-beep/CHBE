name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        # Кодовая база — чистый Python; тестам нужен только pytest.
        # (pandas/numpy нигде не импортируются, ccxt — лениво внутри функций.)
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        # Тесты, читающие data/ (кэш рыночных данных, вне git), пропускаются gracefully.
        run: pytest -q
